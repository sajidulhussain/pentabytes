<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentabytes | The AI Workspace for Builders</title>
    <meta name="description" content="Premium enterprise-grade AI workspace tailored for builders and developers.">
    <meta name="theme-color" content="#000000">
    
    <!-- SEO & Metadata -->
    <link rel="canonical" href="https://pentabytes.com/">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pentabytes.com/">
    <meta property="og:title" content="Pentabytes">
    <meta property="og:description" content="The AI Workspace for Builders.">
    <meta property="og:image" content="https://pentabytes.com/assets/og-image.jpg">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://pentabytes.com/">
    <meta name="twitter:title" content="Pentabytes">
    <meta name="twitter:description" content="The AI Workspace for Builders.">
    <meta name="twitter:image" content="https://pentabytes.com/assets/twitter-card.jpg">

    <!-- CSS Core Architecture -->
    <link rel="stylesheet" href="css/core/reset.css">
    <link rel="stylesheet" href="css/core/variables.css">
    <link rel="stylesheet" href="css/core/typography.css">
    <link rel="stylesheet" href="css/core/layout.css">
    
    <!-- CSS Components -->
    <link rel="stylesheet" href="css/components/sidebar.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/chat.css">
    <link rel="stylesheet" href="css/components/composer.css">
    <link rel="stylesheet" href="css/components/modal.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/forms.css">
</head>
<body>
    <!-- Accessibility: Skip to Content -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>

    <!-- Global Overlays & Containers -->
    <div id="loading-overlay" class="overlay hidden" aria-hidden="true" role="progressbar"></div>
    <div id="toast-container" class="toast-wrapper" aria-live="polite" role="region" aria-label="Notifications"></div>
    <div id="notification-container" class="notification-wrapper" aria-live="assertive" role="region" aria-label="Alerts"></div>
    <dialog id="command-palette" class="palette-modal" aria-labelledby="palette-title"></dialog>

    <div id="pentabytes-app" class="app-layout">
        
        <!-- Sidebar Navigation (Drawer on Mobile) -->
        <aside id="primary-sidebar" class="sidebar drawer" aria-label="Workspace Navigation">
            <div class="sidebar-header">
                <img src="assets/p-logo.svg" alt="Pentabytes Logo" class="brand-logo" width="24" height="24">
                <h1 class="brand-name">PENTABYTES</h1>
                <button id="close-sidebar-btn" class="icon-btn mobile-only" aria-label="Close Sidebar" aria-expanded="true" aria-controls="primary-sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <nav class="sidebar-tabs" aria-label="Workspace Sections">
                <div role="tablist" class="tab-list">
                    <button id="tab-history" role="tab" aria-selected="true" aria-controls="panel-history" tabindex="0">History</button>
                    <button id="tab-projects" role="tab" aria-selected="false" aria-controls="panel-projects" tabindex="-1">Projects</button>
                    <button id="tab-files" role="tab" aria-selected="false" aria-controls="panel-files" tabindex="-1">Files</button>
                </div>
            </nav>

            <div class="sidebar-panels">
                <!-- History Panel -->
                <div id="panel-history" role="tabpanel" aria-labelledby="tab-history" class="panel-content active" tabindex="0">
                    <ul id="history-list" class="nav-list" aria-label="Recent Conversations"></ul>
                </div>

                <!-- Projects Panel -->
                <div id="panel-projects" role="tabpanel" aria-labelledby="tab-projects" class="panel-content hidden" hidden tabindex="0">
                    <div class="panel-actions">
                        <button class="btn-secondary outline btn-full-width" aria-label="Create New Project">New Project</button>
                    </div>
                    <ul id="project-list" class="nav-list" aria-label="Active Projects"></ul>
                </div>

                <!-- Files Panel -->
                <div id="panel-files" role="tabpanel" aria-labelledby="tab-files" class="panel-content hidden" hidden tabindex="0">
                    <div class="panel-actions">
                        <button class="btn-secondary outline btn-full-width" aria-label="Upload Document">Upload File</button>
                    </div>
                    <ul id="file-list" class="nav-list" aria-label="Workspace Documents"></ul>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="open-settings-btn" class="nav-item settings-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-modal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span>Settings</span>
                </button>
                <div class="user-profile">
                    <div class="avatar" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <span class="user-name">Guest</span>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main id="main-content" class="workspace" aria-label="Primary Workspace" tabindex="-1">
            
            <!-- Header -->
            <header class="workspace-header">
                <div class="header-left">
                    <button id="toggle-sidebar-btn" class="icon-btn" aria-label="Toggle Sidebar Navigation" aria-expanded="true" aria-controls="primary-sidebar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    
                    <div class="model-selector">
                        <label for="ai-model" class="sr-only">Select AI Model</label>
                        <select id="ai-model" class="select-input dropdown-minimal">
                            <option value="penta-core">Pentabytes Core</option>
                            <option value="penta-pro" selected>Pentabytes Pro</option>
                            <option value="penta-ultra">Pentabytes Ultra</option>
                        </select>
                    </div>
                </div>
                
                <div class="header-right">
                    <button id="new-chat-btn" class="btn-primary" aria-label="Start New Session">
                        New Session
                    </button>
                </div>
            </header>

            <!-- Chat Area -->
            <section id="chat-viewport" class="chat-area" aria-live="polite" aria-label="Chat Interaction Area">
                <div class="chat-scroll-container">
                    
                    <!-- Premium Hero / Empty State -->
                    <div class="hero-state">
                        <h2 class="hero-title">Pentabytes</h2>
                        <p class="hero-subtitle">The AI Workspace for Builders.</p>
                        
                        <div class="suggestion-grid" role="list" aria-label="Prompt Suggestions">
                            <button class="suggestion-card" role="listitem" data-prompt="Explain this repository">
                                <span class="suggestion-text">Explain this repository</span>
                            </button>
                            <button class="suggestion-card" role="listitem" data-prompt="Debug my JavaScript">
                                <span class="suggestion-text">Debug my JavaScript</span>
                            </button>
                            <button class="suggestion-card" role="listitem" data-prompt="Design a landing page">
                                <span class="suggestion-text">Design a landing page</span>
                            </button>
                            <button class="suggestion-card" role="listitem" data-prompt="Review my architecture">
                                <span class="suggestion-text">Review my architecture</span>
                            </button>
                        </div>
                    </div>

                    <!-- Conversation Feed -->
                    <div id="chat-messages" class="message-feed" aria-live="polite"></div>
                </div>
            </section>

            <!-- Composer Area -->
            <section id="composer-area" class="composer-section" aria-label="Message Input Area">
                <div class="composer-wrapper">
                    <form id="message-form" class="composer-form">
                        
                        <div class="composer-tools">
                            <button type="button" class="icon-btn" aria-label="Attach File">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            </button>
                        </div>
                        
                        <div class="input-container">
                            <label for="prompt-input" class="sr-only">Enter command</label>
                            <textarea id="prompt-input" class="text-input auto-resize" rows="1" placeholder="Command Pentabytes..." required aria-multiline="true"></textarea>
                        </div>
                        
                        <div class="composer-submit">
                            <button type="submit" id="submit-prompt-btn" class="btn-primary icon-only" aria-label="Send Message">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                        
                    </form>
                    
                    <div class="composer-footer">
                        <span class="system-disclaimer">Pentabytes execution output may require human verification.</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Settings Dialog -->
    <dialog id="settings-modal" class="modal" aria-labelledby="modal-title" aria-describedby="modal-desc">
        <div class="modal-surface">
            <header class="modal-header">
                <h2 id="modal-title">System Settings</h2>
                <button id="close-modal-btn" class="icon-btn" aria-label="Close dialog">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </header>
            
            <div id="modal-desc" class="modal-body">
                <section class="settings-section">
                    <h3>Interface</h3>
                    <div class="setting-row">
                        <label for="theme-preference">Appearance Mode</label>
                        <select id="theme-preference" class="select-input">
                            <option value="dark" selected>Dark (Default)</option>
                            <option value="system">System Sync</option>
                        </select>
                    </div>
                </section>
                
                <section class="settings-section">
                    <h3>Data & Privacy</h3>
                    <div class="setting-row">
                        <label for="telemetry-switch">Allow architecture telemetry</label>
                        <div class="switch-container">
                            <input type="checkbox" id="telemetry-switch" class="toggle-switch" role="switch" aria-checked="false">
                            <span class="switch-slider"></span>
                        </div>
                    </div>
                </section>
            </div>
            
            <footer class="modal-footer">
                <button id="cancel-settings" class="btn-secondary outline" type="button">Cancel</button>
                <button id="save-settings" class="btn-primary" type="button">Apply Changes</button>
            </footer>
        </div>
    </dialog>

    <!-- HTML Templates for Dynamic Injection -->
    <template id="template-chat-message">
        <article class="message" aria-label="Message">
            <div class="message-avatar"></div>
            <div class="message-body"></div>
            <div class="message-actions"></div>
        </article>
    </template>

    <template id="template-history-item">
        <li>
            <button class="nav-item">
                <span class="nav-item-title"></span>
                <span class="nav-item-meta"></span>
            </button>
        </li>
    </template>

    <template id="template-project-card">
        <li>
            <button class="nav-item">
                <span class="nav-item-title"></span>
            </button>
        </li>
    </template>

    <template id="template-file-card">
        <li>
            <button class="nav-item">
                <span class="nav-item-title"></span>
            </button>
        </li>
    </template>

    <template id="template-toast">
        <div class="toast-message" role="alert">
            <span class="toast-content"></span>
            <button class="toast-close" aria-label="Dismiss message">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
    </template>

    <!-- JS Application Entry -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
