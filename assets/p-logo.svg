<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
      .cutout { fill: #000000; }
    </style>
  </defs>

  <!-- Background Canvas with Modern Rounded Corners -->
  <rect width="512" height="512" rx="112" class="bg" />

  <!-- 
    Pentabytes Minimal Geometric "P" Logo
    - Concept: Five balanced architectural planes converging into a flawless, perfectly symmetrical geometric monogram.
    - Optimized for pixel-crisp rendering across all required scale steps (16px to 512px).
  -->
  <g transform="translate(96, 64)">
    <!-- Outer Monogram Silhouette -->
    <path class="fg" d="
      M64 0 
      h160 
      c88.366 0 160 71.634 160 160 
      c0 88.366-71.634 160-160 160 
      h-96 
      v124 
      H64 
      V0 
      Z
    " />

    <!-- Perfectly Balanced Negative Space Counter (Aperture) -->
    <path class="cutout" d="
      M128 64
      h96
      c53.02 0 96 42.98 96 96
      c0 53.02-42.98 96-96 96
      h-96
      V64
      Z
    " />

    <!-- Central Pentagonal Core (Representing the 'Penta' structure) -->
    <polygon class="fg" points="138,112 186,112 216,160 186,208 138,208" />
  </g>
</svg>
