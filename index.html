<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pentabytes v2</title>
<!--
This is the starter for Pentabytes v2.
The complete redesign is intentionally split into multiple iterations
to keep it maintainable.
-->
<style>
:root{
 --bg:#000;
 --surface:#050505;
 --card:#090909;
 --border:rgba(255,255,255,.08);
 --text:#fff;
 --muted:#9ca3af;
}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Inter,Arial,sans-serif;
 overflow:hidden;
}
#stars{
 position:fixed;
 inset:0;
 background:
 radial-gradient(circle at 20% 30%,rgba(255,255,255,.08),transparent 25%),
 radial-gradient(circle at 80% 20%,rgba(255,255,255,.05),transparent 20%),
 #000;
}
.app{
 position:relative;
 display:flex;
 height:100vh;
}
aside{
 width:270px;
 background:rgba(5,5,5,.95);
 border-right:1px solid var(--border);
 backdrop-filter:blur(12px);
}
main{flex:1;display:flex;align-items:center;justify-content:center;}
.hero{
 max-width:700px;
 text-align:center;
}
h1{font-size:3rem;margin:.2rem 0;}
p{color:var(--muted);}
button{
 background:#090909;
 color:#fff;
 border:1px solid var(--border);
 padding:14px 22px;
 border-radius:18px;
 cursor:pointer;
 transition:.25s;
}
button:hover{
 transform:translateY(-2px);
 box-shadow:0 0 25px rgba(255,255,255,.08);
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="app">
<aside></aside>
<main>
<div class="hero">
<h1>Pentabytes</h1>
<p>AI Operating System</p>
<button>Ask Pentabytes</button>
</div>
</main>
</div>
</body>
</html>
